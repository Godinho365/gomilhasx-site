# Checagem do site estático a cada push no main e em cada PR: HTML bem fechado, JSON-LD válido e arquivos citados existindo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # o lastmod do sitemap vem do último commit que mudou cada fonte (git log)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python .github/scripts/checar_site.py
